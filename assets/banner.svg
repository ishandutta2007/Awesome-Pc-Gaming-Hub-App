<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0c29" />
      <stop offset="50%" stop-color="#302b63" />
      <stop offset="100%" stop-color="#24243e" />
    </linearGradient>
    
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff007f" />
      <stop offset="50%" stop-color="#7928ca" />
      <stop offset="100%" stop-color="#00dfd8" />
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00dfd8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#00dfd8" stop-opacity="0" />
    </radialGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="350" fill="url(#bg-gradient)" rx="16" />

  <!-- Animated Background Elements -->
  <circle cx="200" cy="100" r="180" fill="url(#glow)">
    <animateTransform attributeName="transform" type="translate" values="0,0; 30,-20; 0,0" dur="8s" repeatCount="indefinite" />
  </circle>
  <circle cx="1000" cy="260" r="220" fill="url(#glow)">
    <animateTransform attributeName="transform" type="translate" values="0,0; -40,25; 0,0" dur="11s" repeatCount="indefinite" />
  </circle>

  <!-- Subtle Cyber Grid -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <animate attributeName="opacity" values="0.2; 0.6; 0.2" dur="4s" repeatCount="indefinite" />
    <line x1="0" y1="50" x2="1200" y2="50" />
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="150" x2="1200" y2="150" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="250" x2="1200" y2="250" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="200" y1="0" x2="200" y2="350" />
    <line x1="400" y1="0" x2="400" y2="350" />
    <line x1="600" y1="0" x2="600" y2="350" />
    <line x1="800" y1="0" x2="800" y2="350" />
    <line x1="1000" y1="0" x2="1000" y2="350" />
  </g>

  <!-- Decorative Accent Bar -->
  <rect x="80" y="75" width="8" height="170" rx="4" fill="url(#accent-grad)" />

  <!-- Controller Graphic Outline on Right Background -->
  <g opacity="0.12" stroke="#ffffff" stroke-width="3" fill="none" transform="translate(850, 70)">
    <path d="M40 80 C 40 40, 70 20, 120 20 C 170 20, 200 40, 200 80 L 220 180 C 230 220, 190 240, 160 210 L 130 180 L 110 180 L 80 210 C 50 240, 10 220, 20 180 Z" />
    <circle cx="75" cy="90" r="18" />
    <circle cx="165" cy="70" r="8" fill="#ffffff" />
    <circle cx="185" cy="90" r="8" fill="#ffffff" />
    <circle cx="145" cy="90" r="8" fill="#ffffff" />
    <circle cx="165" cy="110" r="8" fill="#ffffff" />
  </g>

  <!-- Foreground Content -->
  <g transform="translate(110, 0)">
    <!-- Subtitle Badge -->
    <rect x="0" y="72" width="320" height="32" rx="16" fill="#7928ca" fill-opacity="0.4" stroke="#7928ca" stroke-width="1" />
    <text x="16" y="93" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="400" font-size="14" fill="#ffffff" letter-spacing="1.5">🎮 AWESOME PC GAMING HUB APP</text>

    <!-- Main Title -->
    <text x="0" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="48" fill="#ffffff" filter="url(#shadow)">PC Gaming Hub Ecosystem 🚀</text>

    <!-- Subtitle Description -->
    <text x="0" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="400" font-size="20" fill="#00dfd8" letter-spacing="1.5">Unified Game Launchers, Store Aggregators &amp; Library Managers</text>

    <!-- Category Pills -->
    <g transform="translate(0, 230)">
      <rect x="0" y="0" width="130" height="32" rx="8" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.2" />
      <text x="65" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="600" font-size="14" fill="#ffffff" text-anchor="middle">💻 SaaS Hubs</text>

      <rect x="145" y="0" width="160" height="32" rx="8" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.2" />
      <text x="225" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="600" font-size="14" fill="#ffffff" text-anchor="middle">⚡ Open-Source</text>

      <rect x="320" y="0" width="160" height="32" rx="8" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.2" />
      <text x="400" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="600" font-size="14" fill="#ffffff" text-anchor="middle">🕹️ Emulators &amp; Sync</text>
    </g>
  </g>
</svg>
